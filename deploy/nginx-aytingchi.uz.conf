# Nginx: serve aytingchi.uz on 80/443, proxy to Next on 127.0.0.1:3000
# (Users open https://aytingchi.uz with no :3000.)
# Put under /etc/nginx/sites-available/, symlink to sites-enabled, certbot for SSL.
#
#    sudo certbot --nginx -d aytingchi.uz

server {
	listen 80;
	server_name aytingchi.uz;
	# certbot will add 443 + ssl; or use listen 443 ssl with your cert paths
	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
