[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jamol"
version = "0.1.0"
description = "Jamol: Windows voice assistant with allowlisted app launch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "sounddevice>=0.5.0",
  "SpeechRecognition>=3.10.0",
  "pyttsx3>=2.90",
  "websockets>=12.0",
  "webrtcvad-wheels>=2.0.14",
  "keyboard>=0.13.5; platform_system=='Windows'",
]

[project.optional-dependencies]
voice = [
  "pyaudio>=0.2.14",
]
# Same STT/TTS stack as RealTimeVoice ``backend/`` (faster-whisper + OmniVoice + backend/.env).
backend = [
  "pydantic-settings>=2.6.0",
  "numpy>=1.26.0",
  "faster-whisper>=1.0.3",
  "soundfile>=0.12.1",
  "torch>=2.5.0",
  "torchaudio>=2.5.0",
  "omnivoice>=0.1.0",
  "sounddevice>=0.5.0",
]
whisper = [
  "faster-whisper>=1.0.3",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
jamol = "jamol.__main__:main"
jamol-gui = "jamol.gui_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
