# RealTimeVoice — Docker Compose (one entry: Caddy on 80/443, no :3000 / :8000 in the browser)
#
# 1) cp .env.example .env
# 2) Edit .env: PUBLIC_ORIGIN, WS_URL (and docker/Caddyfile for HTTPS: first line = your domain)
# 3) Configure backend/.env
# 4) docker compose build && docker compose up -d
#
# Browse:  http://<server-ip>  (default)  or  https://<domain>  after Caddyfile + .env
#
# Expose the API on the host (optional, for Postman) — uncomment the two lines on backend.ports
#
# name: ...
name: realtimevoice

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: realtimevoice-backend:latest
    container_name: realtimevoice-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Same browser origin as the app (Caddy). Adjust via root .env PUBLIC_ORIGIN.
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1}
      STT_MODEL_CACHE_DIR: /app/models/whisper_ct2
      HF_HOME: /app/.cache/huggingface
    expose:
      - "8000"
    # Optional: open FastAPI on the host for debugging
    # ports:
    #   - "8000:8000"
    volumes:
      - backend_hf_cache:/app/.cache/huggingface
      - backend_torch_cache:/app/.cache/torch
      - backend_models:/app/models
      - ./myVoice:/app/myVoice:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Optional GPU: install nvidia-container-toolkit, then uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  caddy:
    image: caddy:2.8-alpine
    container_name: realtimevoice-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must match the URL users use (Caddy, no :3000 / :8000)
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://127.0.0.1}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://127.0.0.1/ws/voice}
        NEXT_PUBLIC_WS_API_KEY: ${NEXT_PUBLIC_WS_API_KEY:-}
    image: realtimevoice-frontend:latest
    container_name: realtimevoice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

volumes:
  backend_hf_cache:
  backend_torch_cache:
  backend_models:
